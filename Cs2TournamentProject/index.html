<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 社区娱乐赛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header>
        <div class="container">
            <h1>🎯 CS2 社区娱乐赛</h1>
            <nav>
                <a href="#upcoming">最新赛事</a>
                <a href="#history">历史战绩</a>
            </nav>
        </div>
    </header>

    <!-- 下一场比赛预告 -->
    <section id="upcoming" class="container">
        <h2>🔥 下一战：S4 赛季总决赛</h2>
        <div class="card highlight">
            <p class="time">比赛时间：2026年10月10日 20:00</p>
            <div class="matchup">
                <span class="team">Team Alpha</span>
                <span class="vs">VS</span>
                <span class="team">Team Bravo</span>
            </div>
            <a href="#" class="btn">前往 FACEIT 观战</a>
        </div>
    </section>

    <!-- 历史战绩展示 -->
    <section id="history" class="container">
        <h2>🏆 历史战绩</h2>
        
        <!-- 比赛 1 -->
        <div class="card match-result">
            <div class="match-info">
                <h3>S3 赛季 - 决赛</h3>
                <p>地图：de_mirage</p>
            </div>
            <div class="score-board">
                <span class="team winner">Team Charlie</span>
                <span class="score">13 - 10</span>
                <span class="team">Team Delta</span>
            </div>
        </div>

        <!-- 比赛 2 -->
        <div class="card match-result">
            <div class="match-info">
                <h3>S3 赛季 - 半决赛</h3>
                <p>地图：de_inferno</p>
            </div>
            <div class="score-board">
                <span class="team winner">Team Charlie</span>
                <span class="score">13 - 8</span>
                <span class="team">Team Echo</span>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
