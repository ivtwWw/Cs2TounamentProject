<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 社区娱乐赛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header>
        <div class="container">
            <h1>🎯 CS2 Aussie Laozi Cup</h1>
            <nav>
                <a href="#upcoming">最新赛事</a>
                <a href="#history">历史战绩</a>
            </nav>
        </div>
    </header>

    <!-- 下一场比赛预告 -->
    <section id="upcoming" class="container">
        <h2>🔥 下一战：Aussie Laozi Cup S2</h2>
        <div class="card highlight">
            <p class="time">比赛时间：#Undefined</p>
            <div class="matchup">
                <span class="team">Team Alpha</span>
                <span class="vs">VS</span>
                <span class="team">Team Bravo</span>
            </div>
            <a href="#" class="btn">前往 FACEIT 主页</a>
        </div>
    </section>

    <!-- 历史战绩展示 -->
    <section id="history" class="container">
    <h2>🏆 Aussie Laozi Cup S1</h2>
    <!-- 数据将通过 JavaScript 动态插入到这里 -->
    <div id="match-list"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
